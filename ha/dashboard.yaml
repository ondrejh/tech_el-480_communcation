type: grid
cards:
  - type: vertical-stack
    grid_options:
      columns: full
    cards:
    - type: grid
      title: 🔥 Kotel
      columns: 2
      square: false
      cards:
        - type: custom:modern-circular-gauge
          name: Kotel
          entity: sensor.kotelna_boiler_temperature
          min: 30
          max: 90
          secondary:
            entity: sensor.kotelna_boiler_setpoint
            show_gauge: outer
            min: 30
            max: 90
          segments:
            - from: 30
              color:
                - 3
                - 169
                - 244
            - from: 80
              color:
                - 255
                - 152
                - 0
            - from: 85
              color:
                - 244
                - 67
                - 54
        - type: custom:modern-circular-gauge
          name: Boiler
          entity: sensor.kotelna_hot_water_temperature
          min: 20
          max: 70
          secondary:
            entity: sensor.kotelna_hot_water_setpoint
            show_gauge: outer
            min: 20
            max: 70
        - type: custom:modern-circular-gauge
          name: Termostat
          entity: sensor.kotelna_room_temperature
          min: 15
          max: 30
          secondary:
            entity: sensor.kotelna_room_setpoint
            show_gauge: outer
            min: 15
            max: 30
        - type: custom:modern-circular-gauge
          name: Ventil
          entity: sensor.kotelna_valve_temperature
          min: 20
          max: 70
          secondary:
            entity: sensor.kotelna_valve_setpoint
            show_gauge: outer
            min: 20
            max: 70
    - type: entities
      entities:
        - entity: sensor.kotelna_boiler_state
        - entity: binary_sensor.kotelna_fan
        - entity: sensor.kotelna_fan_power
        - entity: binary_sensor.kotelna_feeder
        - entity: sensor.kotelna_feeder_temperature
        - entity: sensor.kotelna_flue_gas_temperature
        - entity: sensor.kotelna_fuel_level
        - entity: binary_sensor.kotelna_heating_pump
        - entity: binary_sensor.kotelna_hot_water_pump
        - entity: sensor.kotelna_outside_temperature
        - entity: sensor.kotelna_pump_mode
        - entity: sensor.kotelna_valve_open
